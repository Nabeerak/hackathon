services:
  # Frontend Static Site (Docusaurus)
  # Backend is deployed separately from backend-deploy branch
  - type: web
    name: docusaurus-website
    runtime: static
    plan: free
    rootDir: docusaurus-book
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_URL
        value: "https://hackathon-backend-rspn.onrender.com/api"
      - key: BACKEND_URL
        value: "https://hackathon-backend-rspn.onrender.com"
      - key: NODE_ENV
        value: "production"
