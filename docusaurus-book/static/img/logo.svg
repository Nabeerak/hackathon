<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for brain -->
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C2185B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for robotic elements -->
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8D4;stop-opacity:1" />
    </linearGradient>

    <!-- Circuit pattern -->
    <pattern id="circuitPattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M 0 4 L 4 4 L 4 0 M 4 8 L 4 4 L 8 4" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" fill="none" />
      <circle cx="4" cy="4" r="0.5" fill="rgba(255,255,255,0.4)" />
    </pattern>
  </defs>

  <!-- Robotic head/casing base -->
  <rect x="25" y="15" width="50" height="60" rx="15" fill="url(#robotGradient)" opacity="0.3"/>

  <!-- Brain shape with lobes -->
  <path d="M50,20 C35,20 30,28 30,35 C25,35 22,40 25,48 C20,55 25,65 35,68 C35,75 42,78 50,78 C58,78 65,75 65,68 C75,65 80,55 75,48 C78,40 75,35 70,35 C70,28 65,20 50,20 Z"
        fill="url(#brainGradient)"
        stroke="rgba(255,255,255,0.2)"
        stroke-width="1"/>

  <!-- Circuit pattern overlay on brain -->
  <path d="M50,20 C35,20 30,28 30,35 C25,35 22,40 25,48 C20,55 25,65 35,68 C35,75 42,78 50,78 C58,78 65,75 65,68 C75,65 80,55 75,48 C78,40 75,35 70,35 C70,28 65,20 50,20 Z"
        fill="url(#circuitPattern)"/>

  <!-- Brain folds/lobes detail -->
  <path d="M50,25 Q45,30 48,38" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M50,25 Q55,30 52,38" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35,45 Q40,50 35,55" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M65,45 Q60,50 65,55" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Neural connections -->
  <line x1="40" y1="40" x2="45" y2="48" stroke="#00E5FF" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="40" x2="55" y2="48" stroke="#00E5FF" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="35" x2="50" y2="45" stroke="#00E5FF" stroke-width="1" opacity="0.6"/>

  <!-- Neural nodes (glowing points) -->
  <circle cx="40" cy="40" r="2" fill="#00E5FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="40" r="2" fill="#00E5FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="35" r="2" fill="#00E5FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="48" r="1.5" fill="#00E5FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="55" cy="48" r="1.5" fill="#00E5FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.75s" repeatCount="indefinite"/>
  </circle>

  <!-- Robotic antenna/sensors -->
  <line x1="35" y1="25" x2="32" y2="20" stroke="url(#robotGradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="18" r="2" fill="#00E5FF">
    <animate attributeName="r" values="2;2.5;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <line x1="65" y1="25" x2="68" y2="20" stroke="url(#robotGradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="68" cy="18" r="2" fill="#00E5FF">
    <animate attributeName="r" values="2;2.5;2" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Robotic base/neck -->
  <rect x="45" y="75" width="10" height="8" rx="2" fill="url(#robotGradient)" opacity="0.8"/>
  <path d="M 42 83 L 58 83 L 55 88 L 45 88 Z" fill="url(#robotGradient)" opacity="0.6"/>
</svg>
